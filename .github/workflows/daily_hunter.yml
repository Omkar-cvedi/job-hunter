name: Daily 10 AM Job Hunter

on:
  schedule:
    # 04:30 UTC = 10:00 AM IST (Indian Standard Time)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allows you to manually trigger the job with one click on GitHub

permissions:
  contents: write

jobs:
  hunt-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Job Hunter Pipeline
        run: |
          python main.py

      - name: Display Report in GitHub Summary
        run: |
          if [ -f reports/latest_jobs.md ]; then
            cat reports/latest_jobs.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and Push New Reports & Seen History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ seen_jobs.json
          git diff --staged --quiet || git commit -m "chore(jobs): add daily job report [skip ci]"
          git push
